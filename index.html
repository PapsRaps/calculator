<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <div id="calculatorBody">
        <div id="displayResults"><p>21</p></div>
        <div id="keypads">
            <button id="7" class="keypad">7</button>
            <button id="8" class="keypad">8</button>
            <button id="9" class="keypad">9</button>
            <button id="÷" class="keypad">÷</button>
            <button id="4" class="keypad">4</button>
            <button id="5" class="keypad">5</button>
            <button id="6" class="keypad">6</button>
            <button id="x" class="keypad">x</button>
            <button id="1" class="keypad">1</button>
            <button id="2" class="keypad">2</button>
            <button id="3" class="keypad">3</button>
            <button id="-" class="keypad">-</button>
            <button id="C" class="keypad clear">C</button>
            <button id="0" class="keypad">0</button>
            <button id="+" class="keypad">+</button>
            <button id="=" class="keypad equals">=</button>
        </div>
    </div>
</body>
</html>
